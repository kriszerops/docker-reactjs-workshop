# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# Paste into Zerops → Import a project, or:
#   zcli project project-import import.yaml
#
# zeropsSetup is resolved from zerops.yaml in the buildFromGit repo at import
# time. With no repository, that lookup fails and the import is rejected.
# The URL must not end in .git — that suffix fails the clone the same way a
# private repository does (build FAILED, no build log).

project:
  name: docker-reactjs-workshop
  description: Interactive React.js Docker containerization workshop
  tags:
    - workshop
    - react
    - docker
    - vite

services:
  - hostname: workshop
    type: static
    zeropsSetup: workshop
    buildFromGit: https://github.com/kriszerops/docker-reactjs-workshop
    enableSubdomainAccess: true

    minContainers: 1
    maxContainers: 2

    verticalAutoscaling:
      minRam: 0.25
      maxRam: 1
      minCpu: 1
      maxCpu: 2
